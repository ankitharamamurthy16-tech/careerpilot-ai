<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Rich Violet to Deep Indigo -->
    <linearGradient id="cp-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="45%" stop-color="#4f46e5" />
      <stop offset="80%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Luminous Bloom behind Summit -->
    <radialGradient id="cp-summit-glow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Container Border Glow -->
    <linearGradient id="cp-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.15" />
    </linearGradient>

    <!-- Rising Path Gradient -->
    <linearGradient id="cp-path-grad" x1="10%" y1="90%" x2="80%" y2="20%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.4" />
      <stop offset="35%" stop-color="#c4b5fd" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Achievement Star Gradient -->
    <linearGradient id="cp-star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="35%" stop-color="#fef08a" />
      <stop offset="75%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Star Glow -->
    <radialGradient id="cp-star-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#fde047" stop-opacity="0.6" />
      <stop offset="65%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="116" fill="url(#cp-bg-grad)" />
  <rect x="5" y="5" width="502" height="502" rx="111" fill="none" stroke="url(#cp-border-grad)" stroke-width="2.5" />
  <rect width="512" height="512" rx="116" fill="url(#cp-summit-glow)" />

  <!-- Dynamic Trajectory Guidelines (AI Precision) -->
  <path d="M 90 435 C 150 435, 195 395, 245 330 C 285 275, 318 225, 355 170" 
        fill="none" 
        stroke="#a78bfa" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-dasharray="6 10" 
        opacity="0.3" />

  <!-- Smooth Rising Pathway -->
  <path d="M 82 405 C 145 405, 198 362, 252 292 C 292 240, 326 190, 365 138" 
        fill="none" 
        stroke="url(#cp-path-grad)" 
        stroke-width="30" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Upward Arrow Head (Culmination of the Pathway) -->
  <polygon points="426,96 394,186 364,142 334,124" 
           fill="#ffffff" 
           stroke="#ffffff" 
           stroke-width="2" 
           stroke-linejoin="round" />

  <!-- Abstract Human Figure Leaping / Moving Upward (Career Growth) -->
  <!-- Head -->
  <circle cx="232" cy="158" r="26" fill="#ffffff" />

  <!-- Forward Reaching Arm (reaching toward the achievement star) -->
  <path d="M 245 192 C 275 186, 305 174, 335 152" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="20" 
        stroke-linecap="round" />

  <!-- Torso leaning forward into ascent -->
  <path d="M 212 272 C 224 232, 242 205, 256 192" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="24" 
        stroke-linecap="round" />

  <!-- Dynamic High Stepping Forward Leg -->
  <path d="M 216 270 C 238 270, 258 252, 274 228" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="20" 
        stroke-linecap="round" />

  <!-- Propelling Trailing Leg pushing off the rising pathway -->
  <path d="M 156 342 C 176 316, 196 292, 214 272" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="22" 
        stroke-linecap="round" />

  <!-- Small Glowing Achievement Star at the Zenith -->
  <!-- Ambient Radiance -->
  <circle cx="436" cy="72" r="46" fill="url(#cp-star-ambient)" />

  <!-- 4-pointed Faceted Diamond Star -->
  <path d="M 436 42 
           C 436 60, 448 72, 466 72 
           C 448 72, 436 84, 436 102 
           C 436 84, 424 72, 406 72 
           C 424 72, 436 60, 436 42 Z" 
        fill="url(#cp-star-grad)" />

  <!-- Center Sparkle Glint -->
  <circle cx="436" cy="72" r="4.5" fill="#ffffff" />
</svg>
